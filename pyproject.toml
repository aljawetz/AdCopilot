[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adcopilot"
version = "0.1.0"
description = "Explainable deterministic CPA diagnosis for digital advertisers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
adcopilot = "adcopilot.cli:main"

[tool.setuptools.packages.find]
include = ["adcopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
